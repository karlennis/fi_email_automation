# FI Email Automation - full stack in Docker. See DOCKER_DEPLOYMENT.md.
#
# Only ONE host may run the worker and ingestion services against the production Mongo.
# Two hosts (this one plus EC2, or plus a workstation running pm2) can email a customer
# the same report twice. Stop the other host first.
#
# MongoDB is Atlas and Redis is Upstash; both come from backend/.env (MONGODB_URI,
# REDIS_URL). Nothing here publishes a port except `web`.

x-backend: &backend
  build:
    context: .
    dockerfile: Dockerfile
  image: fi-email-backend
  restart: unless-stopped
  init: true
  # Secrets and connection strings. Lives on the host only; .dockerignore keeps it out of
  # the image.
  env_file:
    - backend/.env
  # These win over anything in backend/.env.
  environment: &backend-env
    NODE_ENV: production
    # Must be UTC - see the TZ note in Dockerfile.
    TZ: UTC
    LOG_DIR: /var/log/fi_email
    PORT: "3000"
  logging: &logging
    driver: json-file
    options:
      max-size: "20m"
      max-file: "5"

services:
  # API. A single instance, so it is the scheduler primary (backend/utils/clusterRole.js)
  # and runs the 00:05 document register job.
  api:
    <<: *backend
    container_name: fi-email-api
    command: ["node", "--expose-gc", "--max-old-space-size=1536", "backend/server.js"]
    environment:
      <<: *backend-env
      SCHEDULERS_ENABLED: ${SCHEDULERS_ENABLED:-true}
    volumes:
      - logs:/var/log/fi_email
      - register_outputs:/app/backend/services/outputs
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Scan worker: 00:10 nightly enqueue, the scans themselves, customer delivery.
  worker:
    <<: *backend
    container_name: fi-email-worker
    command: ["node", "--expose-gc", "--max-old-space-size=1536", "backend/worker.js"]
    volumes:
      - logs:/var/log/fi_email
    # Node heap is capped at 1536 MB; the rest is headroom for pdftoppm/tesseract.
    mem_limit: 3g

  # Ingestion worker: 23:00 routing of filter-docs/ into planning-docs/.
  ingestion:
    <<: *backend
    container_name: fi-email-ingestion
    command: ["node", "--expose-gc", "--max-old-space-size=512", "backend/ingestion-worker.js"]
    environment:
      <<: *backend-env
      INGESTION_RUN_ON_STARTUP: ${INGESTION_RUN_ON_STARTUP:-false}
      INGESTION_SCHEDULER_ENABLED: "true"
      INGESTION_CLEANUP_FILTER_DOCS: "true"
    volumes:
      - logs:/var/log/fi_email
    mem_limit: 768m

  # nginx: serves the built frontend and proxies /api/ to `api`.
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: fi-email-web
    container_name: fi-email-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # IP allow-list; copy docker/allow.conf.example to docker/allow.conf first.
      - ./docker/allow.conf:/etc/nginx/allow.conf:ro
    mem_limit: 256m
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional local Redis, for a deployment without Upstash:
  #   docker compose --profile local-redis up -d
  # and set REDIS_URL=redis://redis:6379 in backend/.env.
  redis:
    image: redis:7-alpine
    container_name: fi-email-redis
    profiles: ["local-redis"]
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  logs:
  register_outputs:
  redis_data:
