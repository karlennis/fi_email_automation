# Site config for the `web` container (frontend/Dockerfile copies it to conf.d/default.conf).
# Adapted from the nginx config deploy-ec2.sh writes, minus TLS: this deployment is plain
# HTTP on the server's IP, so access is restricted to the addresses in allow.conf.

server {
    listen 80 default_server;
    server_name _;

    # Who may reach the app at all. allow.conf is bind-mounted from docker/allow.conf on
    # the host (not in git - copy docker/allow.conf.example). Anything not listed gets 403.
    include /etc/nginx/allow.conf;
    deny all;

    client_max_body_size 100M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;

    # Backend API
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://api:3000;
    }

    # Angular app: unknown paths fall back to index.html so client-side routes work.
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
